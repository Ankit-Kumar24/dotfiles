# ============================
# General
# ============================

# Change prefix from Ctrl+b to Ctrl+a (easier reach, and avoids clashing
# with anything else — feel free to keep C-b if you'd rather not relearn it)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on                  # click to select panes/windows, drag to resize, scroll to scroll
set -g base-index 1              # windows start at 1, not 0 (0 is awkward to reach)
setw -g pane-base-index 1
set -g renumber-windows on       # closing a window renumbers the rest, no gaps
set -g history-limit 10000       # scrollback buffer
set -g escape-time 0             # no delay after pressing Esc (matters for vim/nvim inside tmux)
set -g focus-events on           # lets apps inside panes (like nvim) detect focus changes

# True color support — needed for correct colors in nvim, bat, etc.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ============================
# Splits & navigation
# ============================

# More intuitive split bindings (keep current pane's path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + arrow (repeatable)
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5

# Switch windows with Shift+Left/Right (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ============================
# Copy mode (vi-style)
# ============================

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Copy to system clipboard (Wayland, matches your setup)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind p run "wl-paste | tmux load-buffer - ; tmux paste-buffer"

# ============================
# Status bar
# ============================

set -g status-position bottom
set -g status-style bg=default,fg=white
set -g status-left-length 30
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M "
set -g status-justify centre

setw -g window-status-format "#[fg=white] #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan

# ============================
# Misc quality-of-life
# ============================

set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#T"
setw -g automatic-rename on
