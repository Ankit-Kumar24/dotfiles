# Fixed quantum: stops the graph from resizing when a stream starts or stops,
# which caused audio cut-outs (e.g. Spotify glitching when a video played).
# 1024 samples @ 48 kHz ≈ 21 ms latency for every app.
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
