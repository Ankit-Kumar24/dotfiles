############################
# CORE
############################
allow_empty_password = false
full_color = true
save = true
lang = en
numlock = false
box_title = Paulatim, deinde subito
hide_version_string = true

############################
# VISUAL — BASE
############################
bg = 0x001D2021
fg = 0x00EBDBB2
border_fg = 0x003A9D23

blank_box = true
hide_borders = false

margin_box_h = 8
margin_box_v = 1
edge_margin = 0

############################
# INPUT
############################
default_input = password
input_len = 28
clear_password = true
asterisk = *
auth_fails = 5

############################
# INFO / CLOCK
############################
initial_info_text = WELCOME HOME
clock = %a %d %b %Y
bigclock = en
bigclock_seconds = false

hide_keyboard_locks = false
hide_key_hints = true

############################
# ERROR / ALERTS
############################
error_bg = 0x001D2021
error_fg = 0x01D65D0E

############################
# POWER KEYS
############################
shutdown_key = F1
shutdown_cmd = /usr/bin/systemctl poweroff

restart_key = F2
restart_cmd = /usr/bin/systemctl reboot

hibernate_key = F3
hibernate_cmd = /usr/bin/systemctl hibernate

############################
# BRIGHTNESS (NOTEBOOK)
############################
brightness_down_key = F5
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-

brightness_up_key = F6
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%

############################
# ANIMATION 
############################
animation = matrix
animation_timeout_sec = 300

############################
# ANIMATION — SETTINGS
############################
colormix_col1 = 0x40408CFF
colormix_col2 = 0x40A855F7
colormix_col3 = 0x80FF6B35

cmatrix_fg = 0x003A9D23
cmatrix_head_col = 0x01D8A657
cmatrix_min_codepoint = 0x21
cmatrix_max_codepoint = 0x7B

doom_fire_height = 2
doom_fire_spread = 0
doom_top_color    = 0x40F4C542
doom_middle_color = 0x40E64A19
doom_bottom_color = 0x808B0000

; bg_color     = 0xFF120B0B
; fg_color     = 0xFFF2E2D0
; border_color = 0xFFE64A19

gameoflife_fg = 0x003A9D23
gameoflife_initial_density = 0.35
gameoflife_entropy_interval = 20
gameoflife_frame_delay = 7

############################
# MISC
############################
battery_id = BAT0
min_refresh_delta = 6
text_in_center = true
session_log = .local/state/ly-session.log
