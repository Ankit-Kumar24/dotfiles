# ════════════════════════════════════════════════
#  kitty.conf — glass setup for niri
# ════════════════════════════════════════════════

# ── General ─────────────────────────────────────
confirm_os_window_close 0
enable_audio_bell       no
update_check_interval   0

# ── Font ────────────────────────────────────────
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         16.0
disable_ligatures cursor

# ── Glass ───────────────────────────────────────
background_opacity         0.7
background_blur            0
dynamic_background_opacity yes
hide_window_decorations    yes
window_padding_width       6 4 6 6

# ── Cursor ──────────────────────────────────────
cursor_shape                 beam
cursor_beam_thickness        1.8
cursor_shape_unfocused       hollow
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   15.0
cursor_trail                 3
cursor_trail_decay           0.1 0.3
cursor_trail_start_threshold 2

# ── Scrollback ──────────────────────────────────
scrollback_lines              10000
scrollback_pager_history_size 50

# ── Mouse & selection ───────────────────────────
copy_on_select        clipboard
strip_trailing_spaces smart
mouse_hide_wait       2.0
detect_urls           yes
url_style             curly

# ── Performance ─────────────────────────────────
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ── Tab bar ─────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_align       left
tab_title_template  "{index}: {title}"

# ── Key bindings ────────────────────────────────
map ctrl+shift+n   new_os_window
map ctrl+t         new_tab_with_cwd
map ctrl+equal     change_font_size all +1.0
map ctrl+plus      change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0
map ctrl+backspace send_text all \x17
map ctrl+shift+f5  load_config_file

# Glass ↔ solid toggle
map ctrl+shift+o remote_control set-background-opacity --toggle 1

# Fine-tune transparency (single key combo, hold to repeat)
map ctrl+alt+equal set_background_opacity +0.05
map ctrl+alt+minus set_background_opacity -0.05
